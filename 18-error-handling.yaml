# working on error handling in ansible playbook
# This playbook will demonstrate how to handle errors in Ansible playbooks using the 'ignore_errors' directive and the 'failed_when' directive

- name: user creation with error handling
  hosts: local
  connection: local
  become: yes
  tasks:
   - name: check whether the user exists or not
     ansible.builtin.command: "id robodshop"
     register: user_check
     ignore_errors: yes

   - name: print the user output
     ansible.builtin.debug:
       msg: "{{ user_check }}"
  
   - name: createting the user if it does not exist
     ansible.builtin.command: "useradd robodshop"
     when: user_check.rc != 0
    #  register: user_creation